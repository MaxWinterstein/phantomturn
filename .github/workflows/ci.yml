name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Never cancel a run on main: that would leave a merged commit whose fixture
  # privacy check never completed.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PREK_VERSION: v0.4.12

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Single source of truth, so bumping .nvmrc cannot leave CI behind.
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Lint and format check
        run: npx biome ci .

      - name: Tests
        run: node --test "packages/fitfix/test/*.test.mjs"

      # Guards against personal data reaching the repository. Driven off
      # git ls-files rather than a directory glob: a .fit committed anywhere
      # else is exactly the case worth catching, and the watch names its files
      # in uppercase. See AGENTS.md.
      - name: Fixture privacy check
        run: |
          files=$(git ls-files '*.fit' '*.FIT' '*.Fit')
          if [ -z "$files" ]; then echo "no .fit files tracked"; exit 0; fi
          echo "$files"
          node tools/scrub-fixtures.mjs --check $files

      # The site build verifies every import in dist/ resolves, which a plain
      # copy step cannot: a missing module 404s and kills the whole page while
      # leaving CI green.
      - name: Site builds and its imports resolve
        run: node tools/build-web.mjs

      # Everything the local hooks enforce -- YAML validity, merge markers,
      # oversized files, whitespace. Without this, those only ever run on
      # machines that happen to have prek installed, and a bad commit reaches
      # main unremarked.
      - name: Install prek
        run: |
          curl -fsSL --retry 3 \
            "https://github.com/j178/prek/releases/download/${PREK_VERSION}/prek-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C /usr/local/bin --strip-components=1
          prek --version

      - name: Hooks
        run: prek run --all-files --show-diff-on-failure
