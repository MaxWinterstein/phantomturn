<!--
  README banner.

  Opaque, with its own dark background, rather than transparent art that adapts
  to the page. GitHub renders README images through its image proxy, where
  `prefers-color-scheme` follows the reader's operating system and not the
  theme GitHub is actually showing, so an adaptive banner is wrong for whoever
  has those two set differently. One card that looks the same in both is the
  honest option.

  (Note for anyone editing: this is an XML comment, so the project's usual
  double-hyphen dash is illegal in here and makes the whole file fail to parse.)

  The fact strip is a single <text> element rather than three positioned ones:
  no font is guaranteed here, so anything relying on measured text widths
  overlaps in the first font that disagrees.

  Colours are the site's own dark palette (web/style.css).
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320"
     role="img" aria-labelledby="bannerTitle bannerDesc">
  <title id="bannerTitle">phantomturn</title>
  <desc id="bannerDesc">Fixes phantom turns in Garmin pool-swim FIT files. Runs in your browser; nothing is uploaded.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1120"/>
      <stop offset="1" stop-color="#0c2c42"/>
    </linearGradient>
    <clipPath id="card"><rect x="0" y="0" width="1280" height="320" rx="20"/></clipPath>
    <style>
      .sans { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    </style>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1280" height="320" fill="url(#bg)"/>

    <!-- A lane: walls at either end, three lane lines. -->
    <g stroke="#2c3c5a" stroke-width="2">
      <line x1="800" y1="96"  x2="1220" y2="96"/>
      <line x1="800" y1="160" x2="1220" y2="160"/>
      <line x1="800" y1="224" x2="1220" y2="224"/>
    </g>
    <rect x="792"  y="80" width="8" height="160" rx="2" fill="#2c3c5a"/>
    <rect x="1220" y="80" width="8" height="160" rx="2" fill="#2c3c5a"/>

    <!-- The turn that never happened: a dotted length doubling back, struck out. -->
    <path d="M820 128 H1000 c 14 0 14 -18 0 -18 H820" fill="none" stroke="#9db2cc"
          stroke-width="5" stroke-linecap="round" stroke-linejoin="round"
          stroke-dasharray="1 10" opacity="0.65"/>
    <g stroke="#f87171" stroke-width="5" stroke-linecap="round">
      <line x1="996"  y1="103" x2="1024" y2="135"/>
      <line x1="1024" y1="103" x2="996"  y2="135"/>
    </g>

    <!-- The length actually swum: one solid run to the far wall. -->
    <path d="M820 200 H1194 c 14 0 14 -24 0 -24 H820" fill="none" stroke="#38bdf8"
          stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

    <text class="sans" x="64" y="150" fill="#e6edf7" font-size="88" font-weight="700"
          letter-spacing="-3">phantomturn</text>
    <text class="sans" x="66" y="200" fill="#9db2cc" font-size="26">Your watch counted turns that never happened.</text>
    <text class="sans" x="66" y="252" fill="#38bdf8" font-size="16" font-weight="600">Garmin pool-swim FIT repair  ·  runs in your browser  ·  nothing uploaded</text>
  </g>

  <rect x="0.5" y="0.5" width="1279" height="319" rx="20" fill="none" stroke="#2c3c5a"/>
</svg>
