# Managed with prek (https://github.com/j178/prek), a drop-in replacement for
# pre-commit. Install the hooks with `task hooks`.
#
# The hook that matters is fixture-privacy. .gitignore already hides *.fit
# outside the fixtures directory, but a `git add -f` walks straight past that,
# and a Garmin export carries the owner's name, biometrics and watch serial.
# This is the last line of defence -- see AGENTS.md.

repos:
  - repo: local
    hooks:
      # (?i) matters: the watch writes *.FIT in uppercase.
      - id: fixture-privacy
        name: no personal data in FIT files
        entry: node tools/scrub-fixtures.mjs --check
        language: system
        files: (?i)\.fit$
        pass_filenames: true

      # The same needle scan, pointed at everything that is not a FIT file.
      # The hook above selects on the extension, which is how a real Garmin
      # activity id reached three tracked files as a "realistic" test filename
      # with every check green: `<activityId>_ACTIVITY.fit` resolves to a real
      # activity, so the name is personal data even where no file is.
      #
      # No `files` filter: a needle is a byte sequence, and deciding up front
      # which paths are "text" is how a check acquires a blind spot.
      - id: source-privacy
        name: no known personal strings outside FIT files
        entry: node tools/scrub-fixtures.mjs --source
        language: system
        pass_filenames: true

      # The Biome pinned in package.json, called directly rather than through
      # npx: npx would happily download a different version if node_modules is
      # missing, and silent version drift is worse than a clear failure.
      # Run `task setup` first.
      # Selected by extension alone. `types_or` and `files` are ANDed, and
      # prek has no `jsonc` tag and does not treat .jsonc as json, so any
      # tag-based filter excluded biome.jsonc and web/index.html -- the two
      # files CI checked and the commit hook never saw.
      - id: biome
        name: biome check
        # The guard turns a bare ENOENT on a fresh clone into an instruction.
        # Without it the first thing a new contributor saw was an opaque
        # "No such file or directory", whose obvious workaround is
        # `git commit --no-verify` -- which also skips the privacy hook.
        entry: >-
          sh -c 'test -x node_modules/.bin/biome || { echo "biome is not installed, run task setup"; exit 1; };
          exec node_modules/.bin/biome check --no-errors-on-unmatched "$@"' --
        language: system
        files: \.(js|mjs|cjs|css|json|jsonc|html)$
        pass_filenames: true

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude: \.fit$
      - id: end-of-file-fixer
        exclude: \.fit$
      - id: check-merge-conflict
      - id: check-yaml
      # check-json selects on the `json` tag, which never matches .jsonc in the
      # first place -- biome.jsonc is validated by the biome hook above.
      - id: check-json
      - id: check-added-large-files
        # No .fit exclusion: an oversized file is most likely a raw multi-
        # megabyte export, which is precisely what this should stop.
        args: [--maxkb=256]
