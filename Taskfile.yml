version: '3'

# Everything here runs on plain Node 22+ and npm. The only dev dependency is
# Biome; the library itself has none and never will.
#
# Commands are written as block sequences rather than [flow, style]: a `{` is
# the start of a flow mapping in YAML, so `{{.CLI_ARGS}}` inside brackets is a
# parse error.

tasks:
  default:
    desc: Show available tasks
    silent: true
    cmds:
      - task --list

  setup:
    desc: Install dev dependencies and git hooks
    cmds:
      - node --version
      - npm install
      # prek is optional, but say so out loud. Swallowing the failure meant
      # `task setup` reported success having installed no hooks at all --
      # including the one that stops personal data being committed.
      - cmd: |
          if command -v prek >/dev/null 2>&1; then
            prek install
          else
            echo
            echo "  !! prek is not installed, so NO git hooks were set up."
            echo "  !! The fixture privacy check will not run before your commits."
            echo "  !! Install it: https://github.com/j178/prek  (then: task hooks)"
            echo
          fi

  hooks:
    desc: Install the prek git hooks (https://github.com/j178/prek)
    cmds:
      - prek install

  hooks:run:
    desc: Run every hook against every file, not just staged ones
    cmds:
      - prek run --all-files

  test:
    desc: Run the test suite
    cmds:
      - node --test "packages/fitfix/test/*.test.mjs"

  fmt:
    desc: Format everything
    cmds:
      - node_modules/.bin/biome format --write .

  lint:
    desc: Lint and check formatting without writing
    cmds:
      - node_modules/.bin/biome check .

  check:
    desc: Everything CI runs - lint, tests, fixture privacy check, site build
    # Sequential rather than `deps`, which run in parallel and interleave their
    # output. `build` is here because CI runs it: without it, breaking the site
    # build passed locally and failed in CI, while three files claimed parity.
    cmds:
      - task: lint
      - task: test
      - task: 'fixtures:check'
      - task: build

  build:
    desc: Assemble the static site into dist/
    cmds:
      - node tools/build-web.mjs

  web:
    desc: 'Build and serve the site at http://localhost:8080'
    deps:
      - build
    cmds:
      - node tools/serve.mjs

  fix:
    desc: 'Repair a file from the CLI: task fix -- swim.fit'
    cmds:
      - node packages/fitfix/src/cli.mjs {{.CLI_ARGS}}

  pull:
    desc: 'Fetch the latest pool swim from Garmin Connect and show what the fixer would do'
    # pull-latest.py prints status to stderr and exactly one line -- the
    # downloaded path -- to stdout, so the two commands chain cleanly.
    # Needs a one-time `uv run tools/pull-latest.py --login` first.
    cmds:
      - cmd: |
          set -e
          f="$(uv run tools/pull-latest.py)"
          node packages/fitfix/src/cli.mjs "$f" --dry-run

  fixtures:check:
    desc: Verify no personal data made it into the test fixtures
    cmds:
      - node tools/scrub-fixtures.mjs --check packages/fitfix/test/fixtures/*.fit

  fixtures:scrub:
    desc: 'Scrub a file in place before it becomes a fixture: task fixtures:scrub -- new.fit'
    cmds:
      - node tools/scrub-fixtures.mjs {{.CLI_ARGS}}

  clean:
    desc: Remove build output and dependencies
    cmds:
      - rm -rf dist node_modules
